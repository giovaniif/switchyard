[package]
name = "yardd"
version = "0.22.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
portable-pty = "0.8"
# Slack's Web API and Socket Mode (slack.rs). rustls on ring, as the app's
# updater already builds it: no OpenSSL and no aws-lc build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Slack signs the events it sends over HTTP (HMAC-SHA256); ring is already
# in the build through rustls.
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.5", features = ["fs"] }
