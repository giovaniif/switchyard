name: iOS app

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/ios-app.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed beta to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: bash mobile/scripts/prepare.sh
      - name: Build and test on iPhone simulator
        working-directory: mobile
        run: |
          # The newest iPhone with a Dynamic Island: screenshots look like a current phone.
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); phones=[v for k,values in d["devices"].items() if "iOS" in k for v in values if v["name"].startswith("iPhone")]; pro=[v for v in phones if "Pro" in v["name"] and "Max" not in v["name"]]; print((pro or phones)[-1]["udid"])')
          echo "SIM_DEVICE=$device" >> "$GITHUB_ENV"
          xcodebuild test -project Switchyard.xcodeproj -scheme Switchyard -destination "platform=iOS Simulator,id=$device" -derivedDataPath build -resultBundlePath build/Tests.xcresult -jobs 2 CODE_SIGNING_ALLOWED=NO
      - name: Screenshots of the demo
        if: success()
        working-directory: mobile
        run: bash scripts/screenshots.sh "$SIM_DEVICE" build/Build/Products/Debug-iphonesimulator/Switchyard.app build/screenshots
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Switchyard-iOS-screenshots
          path: mobile/build/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Switchyard-iOS-simulator
          path: |
            mobile/build/Build/Products/Debug-iphonesimulator/Switchyard.app
            mobile/build/Tests.xcresult
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: simulator
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Archive and upload beta
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash mobile/scripts/testflight.sh
