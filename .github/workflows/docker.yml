# Builds the web image (Dockerfile) and pushes it to
# ghcr.io/giovaniif/switchyard: `latest` from main, the version (`0.1.0`) when
# release.yml publishes one, and the short sha on every build.
# docker-compose.yml pulls `latest`.
name: Docker image

on:
  workflow_dispatch:
  # release.yml, after it publishes `version`.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "**.md"]

permissions:
  contents: read
  packages: write

concurrency:
  # Called from release.yml, github.workflow is "Release": the release's
  # build must not cancel, or be cancelled by, the one started by the same push.
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/giovaniif/switchyard

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha="$(git rev-parse --short HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          tags="$IMAGE:$sha"
          # A release build runs on main too, but `latest` stays with the push
          # builds: main may have moved past the release commit by now.
          if [ -n "$VERSION" ]; then
            tags="$tags,$IMAGE:$VERSION"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            YARD_BUILD_ID=${{ steps.tags.outputs.sha }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Switchyard
          cache-from: type=gha
          cache-to: type=gha,mode=max
