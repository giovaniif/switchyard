# Builds a Developer ID signed, notarized Switchyard.dmg on a macOS runner, so
# the app runs on a Mac with no checkout, Rust or Bun. Every push to main
# leaves one in the run's artifacts; release.yml calls this for a new version
# and publishes it. Signing secrets: see .github/scripts/macos-sign.sh.
name: macOS app

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "design/**", "**.md"]

permissions:
  contents: read

concurrency:
  # Called from release.yml, github.workflow is "Release": the release's
  # build must not cancel, or be cancelled by, the one started by the same push.
  group: macos-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15 # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Switchyard.app
        env:
          CARGO_BUILD_JOBS: "3"
        run: app/build.sh

      - name: Sign, notarize, make DMG
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: .github/scripts/macos-sign.sh

      - uses: actions/upload-artifact@v6
        with:
          name: Switchyard-dmg
          path: |
            Switchyard-*.dmg
            Switchyard.app.tar.gz
            Switchyard.app.tar.gz.sig
          retention-days: 14
          compression-level: 0

